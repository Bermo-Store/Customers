<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاتورة BERMO STORE</title><style>body{font-family:Tahoma,Arial;background:#eef4f8;margin:0;padding:20px;color:#173b57}.invoice{max-width:720px;margin:auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 35px #0001}.head{display:flex;justify-content:space-between;gap:15px;border-bottom:2px solid #1769a6;padding-bottom:18px}.brand{font-size:25px;font-weight:900;color:#1769a6}.muted{color:#71859a;font-size:12px}.rows{margin-top:22px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e5edf3}.total{font-size:20px;font-weight:900;color:#1769a6}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:800;cursor:pointer}.save{background:#1769a6;color:#fff}.close{background:#edf4fa;color:#173b57}@media print{body{background:#fff;padding:0}.invoice{box-shadow:none;border-radius:0}.actions{display:none}}</style></head><body><div class="invoice"><div class="head"><div><div class="brand">🛍 BERMO STORE</div><div class="muted">فاتورة اشتراك</div></div><div id="date" class="muted"></div></div><div id="content" class="rows"></div><div class="actions"><button class="save" onclick="window.print()">حفظ / طباعة PDF</button><button class="close" onclick="window.close()">إغلاق</button></div></div><script>const x=JSON.parse(sessionStorage.getItem('bermo_invoice')||'null');document.getElementById('date').textContent=new Date().toLocaleDateString('ar-EG');if(!x){document.getElementById('content').innerHTML='<p>لا توجد بيانات للفاتورة.</p>'}else{const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));document.getElementById('content').innerHTML=`<div class="row"><span>العميل</span><b>${esc(x.name)}</b></div><div class="row"><span>الهاتف</span><b>${esc(x.phone)}</b></div><div class="row"><span>البريد الإلكتروني</span><b>${esc(x.email||'—')}</b></div><div class="row"><span>الخدمة</span><b>${esc(x.service)}</b></div><div class="row"><span>تاريخ البداية</span><b>${esc(x.start)}</b></div><div class="row"><span>تاريخ الانتهاء</span><b>${esc(x.end)}</b></div><div class="row"><span>طريقة الدفع</span><b>${esc(x.payment||'—')}</b></div><div class="row total"><span>الإجمالي</span><b>${Number(x.sale||0).toLocaleString('ar-EG')} جنيه</b></div>`}</script></body></html>
