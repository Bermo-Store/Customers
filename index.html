<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BERMO STORE</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;display:grid;place-items:center;background:#03142b;color:#fff;font-family:Tahoma,Arial,sans-serif}
    .box{text-align:center;padding:30px}
    .logo{font-size:32px;font-weight:800;margin-bottom:15px;color:#18c8ff}
    .loader{width:42px;height:42px;border:4px solid rgba(255,255,255,.2);border-top-color:#18c8ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}
    @keyframes spin{to{transform:rotate(360deg)}}
    b{font-size:18px}
    p{color:#b8c7d9;font-size:14px;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">BERMO STORE</div>
    <div class="loader"></div>
    <b>جاري تحميل BERMO STORE...</b>
    <p>يرجى الانتظار...</p>
  </div>
</body>
</html>
