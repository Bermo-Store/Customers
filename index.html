<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07172f">
  <title>BERMO STORE</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; overflow: hidden; background: #f3f7fb; }
    body { height: 100vh; height: 100dvh; }
    #app { display: block; position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; background: #f3f7fb; }
    #fallback { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #173b57; font: 16px Tahoma, Arial, sans-serif; background: #f3f7fb; z-index: 2; pointer-events: none; }
    #fallback.hidden { display: none; }
  </style>
</head>
<body>
  <div id="fallback">جارٍ فتح BERMO STORE…</div>
  <iframe id="app" title="BERMO STORE" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <script>
    // لا تصغّر iframe من الخارج؛ ذلك يغيّر عرض الصفحة الداخلي ويشوّه قوائم الموبايل.
    // بعد تعديل ملف index في Apps Script ونشر إصدار جديد، سيبقى رابط GitHub ثابتًا.
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwTIyM5GwW-2lXPT8RT6DmGHvUJABWnly8AitMVQQEUcsEztR0kSYMF0KhAs0LUzuid/exec';
    const frame = document.getElementById('app');
    frame.addEventListener('load', () => document.getElementById('fallback').classList.add('hidden'));
    frame.src = APP_URL;
  </script>
</body>
</html>
